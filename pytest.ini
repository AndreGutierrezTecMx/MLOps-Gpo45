[pytest]
# Configuración de pytest para el proyecto MLOps-GPO45

# Directorio donde se encuentran los tests
testpaths = tests

# Patrón de nombres de archivos de test
python_files = test_*.py

# Patrón de nombres de clases de test
python_classes = Test*

# Patrón de nombres de funciones de test
python_functions = test_*

# Opciones de línea de comando por defecto
addopts =
    # Mostrar resumen de tests
    -v
    # Mostrar el progreso de los tests
    --tb=short
    # Mostrar print statements
    -s
    # Mostrar cobertura de código (requiere pytest-cov)
    # --cov=src
    # --cov-report=html
    # --cov-report=term-missing
    # Detener en el primer fallo (descomentar si se desea)
    # -x
    # Ejecutar tests en paralelo (requiere pytest-xdist)
    # -n auto

# Marcadores personalizados
markers =
    slow: marca tests que son lentos de ejecutar
    integration: marca tests de integración
    unit: marca tests unitarios
    smoke: marca tests de smoke testing (pruebas rápidas básicas)

# Configuración de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Configuración de logs
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout para tests (requiere pytest-timeout)
# timeout = 300

# Directorio para archivos temporales
# tmp_path_retention_count = 3
# tmp_path_retention_policy = all
